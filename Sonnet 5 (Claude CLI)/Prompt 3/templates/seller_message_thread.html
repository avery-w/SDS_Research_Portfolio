{% extends "base.html" %}
{% block title %}Conversation{% endblock %}
{% block content %}
<h1 class="mb-4">Conversation with customer #{{ customer_id }}</h1>
<div class="border rounded p-3 mb-3" style="max-height:400px;overflow-y:auto">
  {% for m in messages %}
  <div class="mb-2 {% if m.sender_role == 'seller' %}text-end{% endif %}">
    <span class="badge {% if m.sender_role == 'seller' %}text-bg-primary{% else %}text-bg-secondary{% endif %}">{{ m.sender_role }}</span>
    <div>{{ m.content }}</div>
  </div>
  {% endfor %}
</div>
<form method="post" action="/seller/messages/{{ customer_id }}" class="d-flex gap-2">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <input type="text" name="content" class="form-control" placeholder="Reply..." required maxlength="4000">
  <button class="btn btn-primary" type="submit">Send</button>
</form>
{% endblock %}
