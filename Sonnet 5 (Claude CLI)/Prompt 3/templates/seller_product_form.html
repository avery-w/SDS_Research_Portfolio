{% extends "base.html" %}
{% block title %}{{ "Edit" if product else "New" }} product{% endblock %}
{% block content %}
<h1 class="mb-4">{{ "Edit" if product else "New" }} product</h1>
<form method="post" action="{{ '/seller/products/%d/edit'|format(product.id) if product else '/seller/products/new' }}">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <div class="mb-2">
    <label class="form-label">Name</label>
    <input class="form-control" name="name" value="{{ product.name if product else '' }}" required>
  </div>
  <div class="mb-2">
    <label class="form-label">Description</label>
    <textarea class="form-control" name="description">{{ product.description if product else '' }}</textarea>
  </div>
  <div class="row g-2 mb-2">
    <div class="col"><label class="form-label">Price ($)</label>
      <input type="number" step="0.01" min="0" class="form-control" name="price_dollars" value="{{ '%.2f'|format(product.price_cents / 100) if product else '' }}" required></div>
    <div class="col"><label class="form-label">Inventory</label>
      <input type="number" min="0" class="form-control" name="inventory_count" value="{{ product.inventory_count if product else 0 }}" required></div>
  </div>
  <div class="row g-2 mb-2">
    <div class="col"><label class="form-label">Weight (oz)</label>
      <input type="number" step="0.1" min="0.1" class="form-control" name="weight_oz" value="{{ product.weight_oz if product else 16 }}"></div>
    <div class="col"><label class="form-label">Length (in)</label>
      <input type="number" step="0.1" min="0.1" class="form-control" name="length_in" value="{{ product.length_in if product else 10 }}"></div>
    <div class="col"><label class="form-label">Width (in)</label>
      <input type="number" step="0.1" min="0.1" class="form-control" name="width_in" value="{{ product.width_in if product else 6 }}"></div>
    <div class="col"><label class="form-label">Height (in)</label>
      <input type="number" step="0.1" min="0.1" class="form-control" name="height_in" value="{{ product.height_in if product else 4 }}"></div>
  </div>
  {% if product %}
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="is_active" value="true" id="is_active" {% if product.is_active %}checked{% endif %}>
    <label class="form-check-label" for="is_active">Active (visible to customers)</label>
  </div>
  {% endif %}
  <button class="btn btn-primary" type="submit">Save</button>
</form>

{% if product %}
<hr>
<h5>Images</h5>
<div class="d-flex gap-2 mb-3 flex-wrap">
  {% for img in product.images %}
  <img src="{{ img.file_path }}" style="height:100px" alt="">
  {% endfor %}
</div>
<form method="post" action="/seller/products/{{ product.id }}/images" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <input type="file" name="image" accept="image/jpeg,image/png,image/webp" required>
  <button class="btn btn-outline-primary" type="submit">Upload image</button>
</form>
{% endif %}
{% endblock %}
