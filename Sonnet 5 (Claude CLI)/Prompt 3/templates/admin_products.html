{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h1 class="mb-4">All products</h1>
<table class="table">
  <thead><tr><th>Name</th><th>Store</th><th>Price</th><th>Active</th><th></th></tr></thead>
  <tbody>
    {% for p in products %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.store.name }}</td>
      <td>${{ "%.2f"|format(p.price_cents / 100) }}</td>
      <td>{{ "Yes" if p.is_active else "No" }}</td>
      <td>
        <form method="post" action="/admin/products/{{ p.id }}/toggle-active">
          <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
          <button class="btn btn-sm {% if p.is_active %}btn-outline-danger{% else %}btn-outline-success{% endif %}" type="submit">
            {{ "Deactivate" if p.is_active else "Reactivate" }}
          </button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
