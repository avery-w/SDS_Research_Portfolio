{% extends "base.html" %}
{% block title %}Orders{% endblock %}
{% block content %}
<h1 class="mb-4">All orders</h1>
<table class="table">
  <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Override status</th></tr></thead>
  <tbody>
    {% for o in orders %}
    <tr>
      <td>#{{ o.id }}</td>
      <td>{{ o.customer.email }}</td>
      <td>{{ o.status.value }}</td>
      <td>${{ "%.2f"|format(o.total_cents / 100) }}</td>
      <td>
        <form method="post" action="/admin/orders/{{ o.id }}/override-status" class="d-flex gap-1">
          <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
          <select name="status" class="form-select form-select-sm">
            {% for s in ['pending_payment','paid','fulfilled','shipped','delivered','cancelled'] %}
            <option value="{{ s }}" {% if o.status.value == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select>
          <button class="btn btn-sm btn-outline-primary" type="submit">Set</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
