{% extends "base.html" %}
{% block content %}
<h2>Cart</h2>
<table class="table">
  <tr><th>Product</th><th>Qty</th><th>Price</th><th></th></tr>
  {% for i in items %}
  <tr>
    <td>{{ i.product.name }}</td>
    <td>{{ i.quantity }}</td>
    <td>${{ '%.2f'|format(i.product.price * i.quantity) }}</td>
    <td><form method="post" action="{{ url_for('customer.cart_remove', item_id=i.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-danger">Remove</button></form></td>
  </tr>
  {% endfor %}
</table>
<p><strong>Subtotal: ${{ '%.2f'|format(subtotal) }}</strong></p>
<a href="{{ url_for('customer.checkout') }}" class="btn btn-primary">Checkout</a>
{% endblock %}
