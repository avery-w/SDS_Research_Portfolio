{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit' if product else 'New' }} Product</h2>
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input class="form-control mb-2" name="name" placeholder="Name" value="{{ product.name if product else '' }}" required>
  <textarea class="form-control mb-2" name="description" placeholder="Description">{{ product.description if product else '' }}</textarea>
  <input class="form-control mb-2" name="price" type="number" step="0.01" placeholder="Price" value="{{ product.price if product else '' }}" required>
  <input class="form-control mb-2" name="stock_qty" type="number" placeholder="Stock quantity" value="{{ product.stock_qty if product else 0 }}">
  <input class="form-control mb-2" name="weight_oz" type="number" step="0.1" placeholder="Weight (oz)" value="{{ product.weight_oz if product else 8 }}">
  {% if product %}
  <label><input type="checkbox" name="is_active" {{ 'checked' if product.is_active else '' }}> Active</label>
  {% endif %}
  <input class="form-control mb-2" name="images" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp">
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
