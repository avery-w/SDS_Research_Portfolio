{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} Product{% endblock %}
{% block content %}
<h2>{{ 'Edit' if product else 'New' }} Product</h2>
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" class="form-control" name="name" value="{{ product.name if product else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" name="description" rows="3">{{ product.description if product else '' }}</textarea>
  </div>
  <div class="row g-2 mb-3">
    <div class="col">
      <label class="form-label">Price ($)</label>
      <input type="number" step="0.01" min="0" class="form-control" name="price" value="{{ product.price if product else '' }}" required>
    </div>
    <div class="col">
      <label class="form-label">Weight (oz)</label>
      <input type="number" step="0.1" min="0.1" class="form-control" name="weight_oz" value="{{ product.weight_oz if product else 16 }}" required>
    </div>
    <div class="col">
      <label class="form-label">Stock Qty</label>
      <input type="number" min="0" class="form-control" name="stock_qty" value="{{ product.stock_qty if product else 0 }}" required>
    </div>
  </div>
  <div class="row g-2 mb-3">
    <div class="col">
      <label class="form-label">Category</label>
      <input type="text" class="form-control" name="category" value="{{ product.category if product else '' }}">
    </div>
    <div class="col">
      <label class="form-label">SKU</label>
      <input type="text" class="form-control" name="sku" value="{{ product.sku if product else '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Images</label>
    <input type="file" class="form-control" name="images" multiple accept="image/*">
  </div>
  {% if product %}
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" name="is_active" id="is_active" {% if product.is_active %}checked{% endif %}>
      <label class="form-check-label" for="is_active">Active (visible to customers)</label>
    </div>
  {% endif %}
  <button class="btn btn-primary" type="submit">Save Product</button>
</form>
{% endblock %}
