{% extends "base.html" %}
{% block title %}Platform Settings{% endblock %}
{% block content %}
<h2>Platform Settings</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Site name</label>
    <input type="text" class="form-control" name="site_name" value="{{ setting.site_name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Commission rate (%)</label>
    <input type="number" step="0.1" min="0" max="100" class="form-control" name="commission_rate_pct" value="{{ setting.commission_rate_pct }}" required>
  </div>
  <button class="btn btn-primary" type="submit">Save Settings</button>
</form>
{% endblock %}
