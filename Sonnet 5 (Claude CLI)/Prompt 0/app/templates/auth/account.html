{% extends "base.html" %}
{% block title %}My Account{% endblock %}
{% block content %}
<h2>My Account</h2>
<div class="row">
  <div class="col-md-6">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" value="{{ current_user.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" class="form-control mb-2" name="address_line1" placeholder="Street address" value="{{ current_user.address_line1 or '' }}">
        <div class="row g-2">
          <div class="col"><input type="text" class="form-control" name="city" placeholder="City" value="{{ current_user.city or '' }}"></div>
          <div class="col-3"><input type="text" class="form-control" name="state" placeholder="State" value="{{ current_user.state or '' }}"></div>
          <div class="col-3"><input type="text" class="form-control" name="zip_code" placeholder="ZIP" value="{{ current_user.zip_code or '' }}"></div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">New password (leave blank to keep current)</label>
        <input type="password" class="form-control" name="new_password" minlength="8">
      </div>
      <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
  </div>
</div>
{% endblock %}
