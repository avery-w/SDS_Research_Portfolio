version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MEDIA_URL: ${MEDIA_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      UPS_CLIENT_ID: ${UPS_CLIENT_ID}
      UPS_CLIENT_SECRET: ${UPS_CLIENT_SECRET}
      UPS_ACCOUNT_NUMBER: ${UPS_ACCOUNT_NUMBER}
      UPS_API_BASE: ${UPS_API_BASE}
      PROMETHEUS_METRICS: ${PROMETHEUS_METRICS}
    depends_on:
      - db
      - redis
  celery:
    build: .
    command: celery -A ecommerce.celery:app worker -l info
    env_file: .env
    depends_on:
      - db
      - redis
  celery-beat:
    build: .
    command: celery -A ecommerce.celery:app beat -l info
    env_file: .env
    depends_on:
      - db
      - redis
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles
    depends_on:
      - web

volumes:
  pgdata:
  staticfiles:
