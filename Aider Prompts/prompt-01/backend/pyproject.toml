[project]
name = "marketplace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "SQLAlchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.1.1",
  "httpx>=0.27.0",
  "boto3>=1.34.0",
  "python-multipart>=0.0.9",
  "Pillow>=10.3.0",
  "redis>=5.0.4",
  "fastapi-limiter>=0.1.6",
  "tenacity>=8.2.3",
  "jinja2>=3.1.4",
  "itsdangerous>=2.2.0",
  "openai>=1.40.0",
  "orjson>=3.10.7"
]

[tool.uvicorn]
factory = true
