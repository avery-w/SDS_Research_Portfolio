{% extends "base.html" %}
{% block title %}Seller Dashboard – Kilo Marketplace{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
  <h1 class="text-3xl font-bold mb-6">Seller Dashboard</h1>

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
    <div class="bg-white p-6 rounded-xl border border-gray-200">
      <p class="text-sm text-gray-500">Total Orders</p>
      <p class="mt-1 text-3xl font-bold" hx-get="/api/v1/seller/orders" hx-trigger="load" hx-swap="outerHTML" id="stat-orders">0</p>
    </div>
    <div class="bg-white p-6 rounded-xl border border-gray-200">
      <p class="text-sm text-gray-500">Revenue</p>
      <p class="mt-1 text-3xl font-bold" id="stat-revenue">$0.00</p>
    </div>
    <div class="bg-white p-6 rounded-xl border border-gray-200">
      <p class="text-sm text-gray-500">Pending</p>
      <p class="mt-1 text-3xl font-bold" id="stat-pending">0</p>
    </div>
    <div class="bg-white p-6 rounded-xl border border-gray-200">
      <p class="text-sm text-gray-500">Shipped</p>
      <p class="mt-1 text-3xl font-bold" id="stat-shipped">0</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <a href="/seller/products" class="bg-white p-6 rounded-xl border border-gray-200 hover:shadow-lg transition block">
      <span class="text-3xl">📦</span>
      <h3 class="mt-2 font-semibold">Products</h3>
      <p class="text-sm text-gray-500">Manage your inventory</p>
    </a>
    <a href="/seller/orders" class="bg-white p-6 rounded-xl border border-gray-200 hover:shadow-lg transition block">
      <span class="text-3xl">📋</span>
      <h3 class="mt-2 font-semibold">Orders</h3>
      <p class="text-sm text-gray-500">Fulfill and ship orders</p>
    </a>
  </div>
</div>
{% endblock %}
