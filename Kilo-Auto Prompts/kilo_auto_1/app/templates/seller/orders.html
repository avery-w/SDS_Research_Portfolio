{% extends "base.html" %}
{% block title %}My Orders – Kilo Marketplace{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
  <h1 class="text-3xl font-bold mb-6">Seller Orders</h1>

  <div class="flex gap-2 mb-4">
    <span class="px-3 py-1 text-sm bg-green-100 text-green-700 rounded-full" hx-get="/api/v1/seller/orders" hx-vars="status_filter:shipped" hx-target="#orders-body" hx-swap="outerHTML">Shipped: 0</span>
    <span class="px-3 py-1 text-sm bg-yellow-100 text-yellow-700 rounded-full" hx-get="/api/v1/seller/orders" hx-vars="status_filter:pending" hx-target="#orders-body" hx-swap="outerHTML">Pending: 0</span>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <div id="orders-body" class="divide-y divide-gray-200">
      <p class="p-6 text-gray-400 text-center">Loading...</p>
    </div>
  </div>
</div>
{% endblock %}
