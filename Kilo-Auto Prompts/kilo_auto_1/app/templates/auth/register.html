{% extends "base.html" %}
{% block title %}Register – Kilo Marketplace{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl">
    <div class="text-center">
      <span class="text-4xl">🛒</span>
      <h2 class="mt-4 text-3xl font-bold text-gray-900">Create your account</h2>
      <p class="mt-2 text-sm text-gray-500">Join Kilo Marketplace today</p>
    </div>

    <form class="space-y-6" hx-post="/api/v1/auth/register" hx-target="body" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful) { setTimeout(()=>{location.href='/'},300) }">
      <div>
        <label class="block text-sm font-medium text-gray-700">Full Name</label>
        <input name="full_name" type="text" required maxlength="255"
          class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
          placeholder="John Doe">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input name="email" type="email" required
          class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
          placeholder="you@example.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input name="password" type="password" required minlength="8"
          class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
          placeholder="•••••••• (min 8 chars)">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Account Type</label>
        <select name="role" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
          <option value="customer">Customer – Browse & Shop</option>
          <option value="seller">Seller – Open a Store</option>
        </select>
      </div>
      <div>
        <button type="submit" class="w-full px-4 py-3 bg-primary-600 text-white font-semibold rounded-lg hover:bg-primary-700 transition shadow-lg shadow-primary-500/20">
          Create Account
        </button>
      </div>
      <p class="text-sm text-center text-gray-500">
        Already have an account?
        <a href="/login" class="font-medium text-primary-600 hover:text-primary-500">Sign in</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
