{% extends "base.html" %}
{% block title %}Login – Kilo Marketplace{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl">
    <div class="text-center">
      <span class="text-4xl">🛒</span>
      <h2 class="mt-4 text-3xl font-bold text-gray-900">Sign in</h2>
      <p class="mt-2 text-sm text-gray-500">Welcome back to Kilo Marketplace</p>
    </div>

    {% if flash %}
    <div class="p-3 rounded-lg bg-red-50 text-red-700 text-sm">{{ flash }}</div>
    {% endif %}

    <form class="space-y-6" hx-post="/api/v1/auth/login" hx-target="body" hx-swap="outerHTML" hx-include="#login-form input" hx-on::after-request="if(event.detail.successful) { setTimeout(()=>{location.reload()},300) }">
      <div>
        <label for="login-email" class="block text-sm font-medium text-gray-700">Email</label>
        <input id="login-email" name="username" type="email" required autofocus
          class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
          placeholder="you@example.com">
      </div>
      <div>
        <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
        <input id="login-password" name="password" type="password" required
          class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
          placeholder="••••••••">
      </div>
      <div>
        <button type="submit" class="w-full px-4 py-3 bg-primary-600 text-white font-semibold rounded-lg hover:bg-primary-700 transition shadow-lg shadow-primary-500/20">
          Sign in
        </button>
      </div>
      <p class="text-sm text-center text-gray-500">
        Don't have an account?
        <a href="/register" class="font-medium text-primary-600 hover:text-primary-500">Register</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
