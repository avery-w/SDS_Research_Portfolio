{% extends 'base.html' %}
{% block content %}
<h2>Customer dashboard</h2>
<div class="stats-grid">
    <div class="stat-box">
        <h3>Recent orders</h3>
        {% for order in orders %}
            <p>#{{ order.id }} - ${{ '%.2f' % order.total_amount }} - {{ order.status }}</p>
        {% else %}
            <p>No orders yet.</p>
        {% endfor %}
    </div>
</div>
<a class="link-button" href="{{ url_for('customer.order_history') }}">View order history</a>
<a class="link-button" href="{{ url_for('customer.account') }}">Manage account</a>
{% endblock %}
