{% extends "base.html" %}
{% block title %}Manage Orders{% endblock %}
{% block content %}
<h2>Orders</h2>
{% for order in orders.items %}
<div class="card mb-2"><div class="card-body d-flex justify-content-between align-items-center">
<div><strong>{{ order.order_number }}</strong> <span class="badge bg-secondary">{{ order.status }}</span>
<p class="small mb-0">Customer: {{ order.customer.username }} | Total: ${{ "%.2f"|format(order.total|float) }}</p></div>
<form method="POST" action="{{ url_for('admin.override_order', order_id=order.id) }}" class="d-flex gap-1">
<select name="status" class="form-select form-select-sm"><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option><option value="returned">Returned</option></select>
<button class="btn btn-sm btn-primary">Override</button>
</form>
</div></div>
{% endfor %}
{% endblock %}
