{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8">
<div class="card"><div class="card-body">
<h3>Add Product</h3>
<form method="POST" enctype="multipart/form-data">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Price ($)</label><input type="number" step="0.01" name="price" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Stock</label><input type="number" name="stock_quantity" class="form-control" required></div>
    </div>
    <div class="mb-2 mt-2"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
    <div class="row g-2 mt-2">
        <div class="col-md-3"><label class="form-label">SKU</label><input name="sku" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Weight (oz)</label><input type="number" step="0.1" name="weight_oz" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">L (in)</label><input type="number" step="0.1" name="length_in" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">W (in)</label><input type="number" step="0.1" name="width_in" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">H (in)</label><input type="number" step="0.1" name="height_in" class="form-control"></div>
    </div>
    <div class="mb-2 mt-2">
        <label class="form-label">Category</label>
        <select name="category_id" class="form-select">
            <option value="">None</option>
            {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="mb-2"><label class="form-label">Images</label><input type="file" name="images" class="form-control" multiple accept="image/*"></div>
    <button class="btn btn-primary mt-2">Create Product</button>
</form>
</div></div>
</div></div>
{% endblock %}
