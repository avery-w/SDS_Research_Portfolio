{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8">
<div class="card"><div class="card-body">
<h3>Edit: {{ product.name }}</h3>
<form method="POST">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ product.name }}"></div>
        <div class="col-md-3"><label class="form-label">Price</label><input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}"></div>
        <div class="col-md-3"><label class="form-label">Stock</label><input type="number" name="stock_quantity" class="form-control" value="{{ product.stock_quantity }}"></div>
    </div>
    <div class="mb-2 mt-2"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea></div>
    <div class="mb-2"><label class="form-label">SKU</label><input name="sku" class="form-control" value="{{ product.sku }}"></div>
    <div class="form-check mb-2"><input type="checkbox" name="is_active" class="form-check-input" {% if product.is_active %}checked{% endif %}><label class="form-check-label">Active</label></div>
    <button class="btn btn-primary">Save</button>
</form>
</div></div>
</div></div>
{% endblock %}
