{% extends "base.html" %}
{% block title %}AI Chat{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8">
<div class="card"><div class="card-body">
<h4>💬 AI Assistant</h4>
<div id="chat-box" style="height:400px;overflow-y:auto;border:1px solid #dee2e6;border-radius:8px;padding:12px;margin-bottom:12px;"></div>
<form id="chat-form" class="d-flex gap-2">
    <input id="chat-input" class="form-control" placeholder="Ask me anything..." autocomplete="off">
    <button class="btn btn-primary">Send</button>
</form>
</div></div>
</div></div>
{% endblock %}
{% block extra_js %}
<script>
const history = [];
document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    appendMsg('You', msg);
    history.push({role: 'user', content: msg});
    const res = await fetch('/chatbot/chat/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: msg, history: history.slice(-20)})
    });
    const data = await res.json();
    appendMsg('AI', data.reply);
    history.push({role: 'assistant', content: data.reply});
});
function appendMsg(sender, text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = 'mb-2';
    div.innerHTML = `<strong>${sender}:</strong> ${text}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>
{% endblock %}
