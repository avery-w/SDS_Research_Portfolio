{% extends "shop/base.html" %}
{% block content %}
<h1>Your account</h1>
<p>Signed in as <strong>{{ user.username }}</strong> ({{ user.get_role_display }}).</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Save</button></form>
<p><a href="{% url 'password_change' %}">Change password</a></p>
{% endblock %}
