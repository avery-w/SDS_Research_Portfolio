{% extends "base.html" %}
{% block content %}
{% set f = request.form if request.method == 'POST' else {} %}
<form method="post" enctype="multipart/form-data" class="card narrow">
  <h1>{{ 'Edit' if p else 'New' }} product</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Name <input name="name" maxlength="150" required value="{{ f.name or (p.name if p) }}"></label>
  <label>Description <textarea name="description" maxlength="5000">{{ f.description or (p.description if p) }}</textarea></label>
  <div class="row">
    <label>Price (USD) <input name="price" type="number" step="0.01" min="0" required value="{{ f.price or ('%.2f'|format(p.price_cents / 100) if p) }}"></label>
    <label>Stock <input name="stock" type="number" min="0" required value="{{ f.stock or (p.stock if p) }}"></label>
  </div>
  <p class="muted small">Package size is used for UPS dimensional weight (L × W × H / 139).</p>
  <div class="row">
    <label>Weight (lb) <input name="weight_lb" type="number" step="0.01" min="0.01" max="150" required value="{{ f.weight_lb or (p.weight_lb if p) }}"></label>
    <label>Length (in) <input name="length_in" type="number" step="0.1" min="0.1" max="108" required value="{{ f.length_in or (p.length_in if p) }}"></label>
    <label>Width (in) <input name="width_in" type="number" step="0.1" min="0.1" max="108" required value="{{ f.width_in or (p.width_in if p) }}"></label>
    <label>Height (in) <input name="height_in" type="number" step="0.1" min="0.1" max="108" required value="{{ f.height_in or (p.height_in if p) }}"></label>
  </div>
  {% if p and p.image %}<img class="thumb" src="{{ url_for('static', filename='uploads/' ~ p.image) }}" alt="">{% endif %}
  <label>Image (JPEG, PNG, WEBP, GIF, up to 5 MB) <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif"></label>
  <label><input type="checkbox" name="active" {{ 'checked' if not p or p.active }}> Listed for sale</label>
  <button>Save</button>
</form>
{% endblock %}
